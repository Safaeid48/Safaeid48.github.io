<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b564f"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#cfc8bc;stroke-width:1.4}
      .key{fill:#f6ece8;stroke:#8a2b1f;stroke-width:1.4}
      .lbl{fill:#1b1a17;text-anchor:middle;dominant-baseline:central}
      .sub{fill:#6f6a62;font-size:12.5px;text-anchor:middle;dominant-baseline:central}
      .ln{fill:none;stroke:#5b564f;stroke-width:1.5;marker-end:url(#a)}
      .tag{fill:#6f6a62;font-size:12.5px;font-style:italic}
      .lane{fill:#6f6a62;font-size:12px;letter-spacing:.12em;font-weight:600}
    </style>
  </defs>

  <text class="lane" x="24" y="34">TRAINING</text>
  <text class="lane" x="24" y="262">INFERENCE</text>
  <line x1="24" y1="236" x2="936" y2="236" stroke="#e6e1d8" stroke-dasharray="4 5"/>

  <!-- Training lane -->
  <rect class="box" x="24" y="58" width="150" height="104" rx="10"/>
  <text class="lbl" x="99" y="80" font-weight="600">Smartphone data</text>
  <text class="sub" x="99" y="104">Location · GPS</text>
  <text class="sub" x="99" y="124">WiFi · Cells</text>
  <text class="sub" x="99" y="144">(location stream used)</text>

  <rect class="box" x="204" y="82" width="138" height="56" rx="10"/>
  <text class="lbl" x="273" y="101">Remove noisy</text>
  <text class="lbl" x="273" y="121">data points</text>

  <rect class="box" x="372" y="82" width="120" height="56" rx="10"/>
  <text class="lbl" x="432" y="101">Label</text>
  <text class="lbl" x="432" y="121">matching</text>

  <rect class="box" x="522" y="82" width="112" height="56" rx="10"/>
  <text class="lbl" x="578" y="110">Windowing</text>

  <rect class="box" x="664" y="82" width="124" height="56" rx="10"/>
  <text class="lbl" x="726" y="101">Statistical</text>
  <text class="lbl" x="726" y="121">features</text>

  <rect class="key" x="818" y="82" width="118" height="56" rx="10"/>
  <text class="lbl" x="877" y="101" font-weight="600">Random</text>
  <text class="lbl" x="877" y="121" font-weight="600">forest</text>

  <path class="ln" d="M174 110H200"/>
  <path class="ln" d="M342 110H368"/>
  <path class="ln" d="M492 110H518"/>
  <path class="ln" d="M634 110H660"/>
  <path class="ln" d="M788 110H814"/>

  <!-- Inference lane -->
  <rect class="box" x="24" y="300" width="150" height="56" rx="10"/>
  <text class="lbl" x="99" y="328">Test window</text>

  <path d="M290 288L364 328L290 368L216 328Z" fill="#fff" stroke="#cfc8bc" stroke-width="1.4"/>
  <text class="lbl" x="290" y="319" font-size="13.5">Location</text>
  <text class="lbl" x="290" y="337" font-size="13.5">available?</text>

  <rect class="box" x="420" y="352" width="168" height="48" rx="10"/>
  <text class="lbl" x="504" y="376">Interpolate gaps</text>

  <rect class="key" x="818" y="300" width="118" height="56" rx="10"/>
  <text class="lbl" x="877" y="319" font-weight="600">Activity</text>
  <text class="lbl" x="877" y="339" font-weight="600">prediction</text>

  <path class="ln" d="M174 328H212"/>
  <path class="ln" d="M364 328H814"/>
  <text class="tag" x="380" y="318">yes</text>
  <path class="ln" d="M290 368V376H416"/>
  <text class="tag" x="300" y="392">no</text>
  <path class="ln" d="M588 376H700V332"/>
  <path class="ln" d="M877 138V296" stroke-dasharray="5 4"/>
  <text class="tag" x="868" y="222" text-anchor="end">trained model</text>
</svg>
